<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="tictactoe.css">
</head>

<body>
    <main>
        <h1>Tic Tac Toe</h1>
        
        <fieldset>
            <legend>Game Settings</legend>
            <div>
                <label for="gridSize">Grid size:</label>
                <input id="gridSize" type="number" value="3" min="2" style="width:50px" onchange="newBoard()">
            </div>
            <div>
                <input id="3D" type="checkbox" onchange="newBoard()">
                <label for="3D">3D Mode</label>
            </div>
            <div>
                <input id="moveTable" type="checkbox">
                <label for="moveTable">Moving board</label>
            </div>
            <div>
                <input id="computerFirst" type="checkbox" onchange="newBoard()">
                <label for="computerFirst">Computer plays first</label>
            </div>
            <button type="button" onclick="newBoard()">New Game</button>
        </fieldset>

        <section aria-label="Game board">
            <div id="board" style="display:flex;flex-wrap:wrap;">
                <div id="p0"></div>
            </div>
        </section>

        <p id="msg" role="status" aria-live="polite"></p>
    </main>

    <noscript>
        <p><strong>This game requires JavaScript to be enabled.</strong></p>
    </noscript>

    <script src="tictactoe.js"></script>
</body>

</html>
