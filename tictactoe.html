<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        button {
            width:  50px;
            height: 50px;
            font-size: 30pt;
        }
        button:disabled {
            color: black;
        }
        div {
            margin: 10px;
        }
    </style>
    <script src="tictactoe.js"></script>
</head>

<body>
    <label for="gridSize">grid size</label>
    <input id="gridSize" type=number value=3 min=2 style="width:25px" onchange="newBoard()">
    <br>
    <input id="3D" type=checkbox onchange="newBoard()">
    <label for="3D">3D</label>
    <br>
    <input id="moveTable" type=checkbox>
    <label for="moveTable">moving table</label>
    <div id='board' style="display:flex;flex-wrap:wrap;">
        <div id='p0'>
            <br id='l0'>
            <button id=0 onClick="setPos(0)">&nbsp;</button><button id=1 onClick="setPos(1)">&nbsp;</button><button id=2 onClick="setPos(2)">&nbsp;</button>
            <br id='l1'>
            <button id=3 onClick="setPos(3)">&nbsp;</button><button id=4 onClick="setPos(4)">&nbsp;</button><button id=5 onClick="setPos(5)">&nbsp;</button>
            <br id='l2'>
            <button id=6 onClick="setPos(6)">&nbsp;</button><button id=7 onClick="setPos(7)">&nbsp;</button><button id=8 onClick="setPos(8)">&nbsp;</button>
        </div>
    </div>
</body>
</html>
