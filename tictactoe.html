<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    button {
        width:  50px;
        height: 50px;
        font-size: 30pt;
    }
    button:disabled {
        color: black;
    }
</style>
<script>
var player = 'X';
function setPos(id) {
    var btn = document.getElementById(id)
    btn.disabled = true
    btn.innerHTML = player
    checkVictory(id, player)
    player = (player=='X') ? 'O' : 'X'
}
function checkVictory(pos, player) {
    i = pos%3
    j = Math.floor(pos/3)
    posW = 3*j + (i+2)%3
    posE = 3*j + (i+1)%3
    posS = 3*((j+1)%3) + i
    posN = 3*((j+2)%3) + i
    posA = 3*((j+1)%3) + (i+1)%3
    posB = 3*((j+2)%3) + (i+2)%3
    posC = 3*((j+1)%3) + (3+i-1)%3
    posD = 3*((j+2)%3) + (3+i-2)%3
    if (document.getElementById(posW).innerHTML==player && document.getElementById(posE).innerHTML==player)
        endGame(player)
    else if (document.getElementById(posS).innerHTML==player && document.getElementById(posN).innerHTML==player)
        endGame(player)
    else if (i==j && document.getElementById(posA).innerHTML==player && document.getElementById(posB).innerHTML==player)
        endGame(player)
    else if ((i+j)==2 && document.getElementById(posC).innerHTML==player && document.getElementById(posD).innerHTML==player)
            endGame(player)
}
function endGame(player) {
    alert("Player " + player + " won.")
    for (i=0; i<9; i++)
        document.getElementById(i).disabled = true
}
</script>
</head>

<body>
<label for="gridSize">grid size</label>
<input id="gridSize" type=number value=3 min=2 style="width:25px" disabled=true>
<br>
<input id="moveTable" type=checkbox disabled=true>
<label for="moveTable">moving table</label>
<br>
<input id="3D" type=checkbox disabled=true>
<label for="3D">3D</label>
<br>

<br>
<button id=0 onClick="setPos(0)">&nbsp;</button>
<button id=1 onClick="setPos(1)">&nbsp;</button>
<button id=2 onClick="setPos(2)">&nbsp;</button>
<br>
<button id=3 onClick="setPos(3)">&nbsp;</button>
<button id=4 onClick="setPos(4)">&nbsp;</button>
<button id=5 onClick="setPos(5)">&nbsp;</button>
<br>
<button id=6 onClick="setPos(6)">&nbsp;</button>
<button id=7 onClick="setPos(7)">&nbsp;</button>
<button id=8 onClick="setPos(8)">&nbsp;</button>
</body>
</html>
