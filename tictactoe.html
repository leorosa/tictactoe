<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    button {
        width:  50px;
        height: 50px;
        font-size: 30pt;
    }
    button:disabled {
        color: black;
    }
</style>
<script>
var player = 'X';
function setPos(id) {
    var btn = document.getElementById(id)
    btn.disabled = true
    btn.innerHTML = player
    checkVictory(id, player)
    player = (player=='X') ? 'O' : 'X'
}
function checkVictory(id, player) {
    i = id%3
    j = Math.floor(id/3)
    idW = 3*j + (i+2)%3
    idE = 3*j + (i+1)%3
    idS = 3*((j+1)%3) + i
    idN = 3*((j+2)%3) + i
    idA = 3*((j+1)%3) + (i+1)%3
    idB = 3*((j+2)%3) + (i+2)%3
    idC = 3*((j+1)%3) + (3+i-1)%3
    idD = 3*((j+2)%3) + (3+i-2)%3
    if (document.getElementById(idW).innerHTML==player && document.getElementById(idE).innerHTML==player)
        endGame(player)
    else if (document.getElementById(idS).innerHTML==player && document.getElementById(idN).innerHTML==player)
        endGame(player)
    else if (id%2==0) {
        if (document.getElementById(idA).innerHTML==player && document.getElementById(idB).innerHTML==player)
            endGame(player)
        else if (document.getElementById(idC).innerHTML==player && document.getElementById(idD).innerHTML==player)
            endGame(player)
    }
}
function endGame(player) {
    alert("Player " + player + " won.")
    for (i=0; i<9; i++)
        document.getElementById(i).disabled = true
}
</script>
</head>

<body>
<br>
<button id=0 onClick="setPos(0)">&nbsp;</button>
<button id=1 onClick="setPos(1)">&nbsp;</button>
<button id=2 onClick="setPos(2)">&nbsp;</button>
<br>
<button id=3 onClick="setPos(3)">&nbsp;</button>
<button id=4 onClick="setPos(4)">&nbsp;</button>
<button id=5 onClick="setPos(5)">&nbsp;</button>
<br>
<button id=6 onClick="setPos(6)">&nbsp;</button>
<button id=7 onClick="setPos(7)">&nbsp;</button>
<button id=8 onClick="setPos(8)">&nbsp;</button>
</body>
</html>
