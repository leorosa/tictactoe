<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        button {
            width:  50px;
            height: 50px;
            font-size: 30pt;
        }
        button:disabled {
            color: black;
        }
        div {
            margin: 10px;
        }
    </style>
    <script src="tictactoe.js"></script>
</head>

<body>
    <label for="gridSize">grid size</label>
    <input id="gridSize" type=number value=3 min=2 style="width:25px" onchange="newBoard()">
    <br>
    <input id="3D" type=checkbox onchange="newBoard()">
    <label for="3D">3D</label>
    <br>
    <input id="moveTable" type=checkbox>
    <label for="moveTable">moving board</label>
    <br>
    <input id="computerFirst" type=checkbox onchange="newBoard()">
    <label for="computerFirst">computer play first</label>
    <br>
    <input type=button onclick="newBoard()" value="New Game">
    <div id='board' style="display:flex;flex-wrap:wrap;">
        <div id='p0'></div>
    </div>
    <script>newBoard()</script>
</body>
</html>
